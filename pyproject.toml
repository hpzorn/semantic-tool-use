[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-tool-use"
version = "0.1.0"
description = "Ontology server and knowledge graph backend for semantic AI tool orchestration"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Hans-Peter Zorn", email = "hpz@zorns.org" },
]
dependencies = [
    "rdflib>=7.0",
    "pyoxigraph>=0.3",
    "pydantic-settings>=2.0",
    "mcp>=1.0,<2.0",
    "click>=8.0",
    "httpx>=0.28.1",
    "anyio",
]

[project.optional-dependencies]
search = [
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]
llm = [
    "anthropic>=0.25",
]
http = [
    "uvicorn[standard]>=0.27",
    "fastapi>=0.110",
]
all = [
    "semantic-tool-use[search,llm,http]",
]

[project.scripts]
wikidata-server = "wikidata_server.__main__:main"
mcp-check = "mcp_check.mcp_check:cli"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_server", "src/knowledge_graph", "src/mcp_check", "src/wikidata_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "pyshacl>=0.31.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "rdflib>=7.6.0",
    "uvicorn>=0.41.0",
]
